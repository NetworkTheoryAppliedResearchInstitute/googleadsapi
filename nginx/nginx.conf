# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf  —  LOCAL DEVELOPMENT  (HTTP only, port 80)
# nginx for Windows docs: https://nginx.org/en/docs/windows.html
# Beginner's guide:       https://nginx.org/en/docs/beginners_guide.html
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Logging ───────────────────────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Rate limiting — 30 req/min per IP ────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Upstream: FastAPI / uvicorn ───────────────────────────────────────────
    # "fastapi" resolves to the Docker service name defined in docker-compose.yml
    upstream fastapi_backend {
        server fastapi:8000;
        keepalive 32;
    }

    # ── HTTP server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ── API routes → FastAPI ──────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass         http://fastapi_backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Long timeouts — BatchJobService calls can run for minutes
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
            proxy_connect_timeout 10s;
        }

        # ── Swagger UI / ReDoc (dev only) ─────────────────────────────────────
        location /docs {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        # ── Health check — no rate limit ─────────────────────────────────────
        location /health {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
        }

        # ── Block everything else ─────────────────────────────────────────────
        location / {
            return 404 '{"error":"not found"}';
            add_header Content-Type application/json;
        }
    }
}
