# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  —  PRODUCTION OVERLAY (Linux VPS)
#
# Usage (on your server):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before first run:
#   1. Replace YOUR_DOMAIN_HERE in nginx/nginx.prod.conf with your real domain
#   2. Run: sudo certbot certonly --standalone -d yourdomain.com
#      (This creates /etc/letsencrypt/live/yourdomain.com/)
# ─────────────────────────────────────────────────────────────────────────────

services:

  fastapi:
    restart: always

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certs — generated by certbot on the host
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro

  # ── Certbot — auto-renews TLS certificates ──────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    # Renew check every 12 hours; certbot only renews when <30 days remain
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 43200 & wait $${!}; done"
